# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Headroom offline-spike golden case (tool-scout #4769). Contract: docs/evals.md.
#
# QUESTION: after Headroom compresses a red `node --test` TAP, can an agent still
# recover the failing test's name and its `not ok` line from the compressed text?
# Agents verify by reading exactly those lines (CLAUDE.md "npm test buffers the
# reporter"); silent elision would make them misreport what they verified.
#
# OFFLINE + CI-SAFE: promptfoo's built-in `echo` provider returns the rendered
# prompt verbatim, so there are ZERO network/LLM calls, no API key, and no
# Headroom at CI time. advisory-checks.yml runs every evals/*.yaml; this file is
# picked up with no workflow edit.
#
# THE FIXTURE IS REAL SPIKE OUTPUT, embedded inline (no fixture file is added):
#   - `tap_raw`        = the planted-failing TAP that scripts/headroom-spike.sh
#                        captures (a throwaway test file under /tmp, 60 subtests,
#                        exactly one failure).
#   - `tap_compressed` = the tool_result text Headroom 0.40.0 returned for it via
#                        headroom.compress(...) with default config.
# Re-generate both by running scripts/headroom-spike.sh and copying
# /tmp/hydra-headroom-spike/corpus/tap-red.txt and
# /tmp/hydra-headroom-spike/out/tap-red.compressed.default.txt.
#
# DO NOT WEAKEN THE ASSERTIONS TO MAKE THIS PASS. If a future Headroom version
# elides the failing name, the red advisory result IS the NO-GO evidence.
# The CONTROL test proves the assertions can pass on the uncompressed TAP.

description: >-
  Headroom spike — is the failing test name still recoverable from compressed
  node:test TAP? Offline echo provider, no API key, no Headroom at CI time.

prompts:
  - >-
    The tool output below is what the agent sees. Name the failing test.


    {{tap}}

providers:
  - id: echo

