# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Hydra eval: FIXTURE SELF-TEST for the skill_prune contract-token-parity
# scorer (issue #2949, epic #2944 — reworked by issue #4268). The eval
# CONTRACT lives in docs/evals.md — read it before editing.
#
# THIS FILE IS NOT THE GATE (issue #4268)
# ====================================================================
# Before #4268 this config WAS the arbiter hydra-skill-prune's Step 3 treated
# as a hard PR-abort — but both its tests supplied a hardcoded `skill_body`
# literal through the `echo` provider, so it asserted a CONSTANT STRING
# contains substrings of itself. It returned 2/2 for every possible prune,
# including one that deleted every contract token in the real playbook (see
# issue #4268 for the measured demonstration: PR #4267 shipped exactly that).
#
# The REAL gate is now `evals/skill-prune/parity.yaml`, which runs the SAME
# scorer (`evals/scorers/contract-token-parity.ts`) against the ACTUAL
# pre-prune/post-prune pair staged by the playbook — see that file's header.
# This file stays as the scorer's own fixture self-test: a valid-prune and an
# over-prune fixture pair proving the scorer's PASS/FAIL discrimination is
# correct, independent of any real prune. It is picked up by the advisory
# eval-gate step in `.github/workflows/advisory-checks.yml` (`for cfg in
# evals/*.yaml`); `evals/skill-prune/parity.yaml` deliberately is not (see its
# own header).
#
# DELIBERATELY OFFLINE — NO LIVE PROVIDER CALLS (same contract as golden.yaml).
# ====================================================================
# The `echo` provider returns the rendered prompt VERBATIM and makes ZERO
# network/LLM calls; no ANTHROPIC_API_KEY (no such CI secret exists — adding
# one is an ADR-0005 operator escalation). This eval verifies the SCORER's
# own discrimination, NOT live behavioral parity — behavioral golden-task
# replay against real Anthropic calls is the operator-gated live-provider
# follow-up (docs/evals.md § "Live-provider follow-up"), out of scope here.

description: >-
  Hydra skill_prune contract-token-parity scorer — fixture self-test. Proves
  the scorer (evals/scorers/contract-token-parity.ts) correctly discriminates
  a valid prune (duplication removed, every load-bearing token survives) from
  an over-prune (a load-bearing token dropped). The REAL gate against the
  actual before/after pair is evals/skill-prune/parity.yaml. echo provider =
  no LLM calls.

prompts:
  # Not asserted on directly (the scorer reads context.vars.before/after) —
  # present only because promptfoo requires at least one prompt template.
  - "before:\n{{before}}\n\nafter:\n{{after}}"

providers:
  # promptfoo built-in; returns the rendered prompt unchanged, no API key.
  - id: echo

tests:
  - description: a valid prune (duplication removed) preserves every load-bearing token
    vars:
      # `before`: every load-bearing token class present, PLUS a duplicated
      # sentence restating the worktree-guard preamble (the kind of
      # duplication sediment skill_prune is meant to remove).
      before: >-
        CRITICAL SAFETY RULE: run this in a fresh git worktree; never push
        directly to master (always a feature branch). Before opening the PR
        run npm test && npm run typecheck && npm run typecheck:test && npm run
        build. Operator escalation is the closed ADR-0005 list only. The PR
        body must carry closes #2949.

        Reminder: this MUST run inside a git worktree, per the
        CRITICAL SAFETY RULE above — do not skip it.
      # `after`: the duplicated reminder paragraph is gone (a genuine no-op
      # deletion); every load-bearing token from `before` still survives.
      after: >-
        CRITICAL SAFETY RULE: run this in a fresh git worktree; never push
        directly to master (always a feature branch). Before opening the PR
        run npm test && npm run typecheck && npm run typecheck:test && npm run
        build. Operator escalation is the closed ADR-0005 list only. The PR
        body must carry closes #2949.
    assert:
      # The scorer must return pass:true — every load-bearing token survived
      # a legitimate duplication prune.
      - type: javascript
        value: file://scorers/contract-token-parity.ts

  - description: an OVER-pruned skill that dropped a contract token fails parity
    vars:
      before: >-
        CRITICAL SAFETY RULE: run this in a fresh git worktree; never push
        directly to master (always a feature branch). Before opening the PR
        run npm test && npm run typecheck && npm run typecheck:test && npm run
        build. Operator escalation is the closed ADR-0005 list only. The PR
        body must carry closes #2949.
      # This body was pruned too aggressively — the never-push-to-master
      # invariant was stripped as if it were a no-op. The deletion test MUST
      # catch this so the skill_prune run aborts its PR (AC #2).
      after: >-
        CRITICAL SAFETY RULE: run this in a fresh git worktree. Before opening
        the PR run npm test && npm run typecheck && npm run typecheck:test &&
        npm run build. Operator escalation is the closed ADR-0005 list only.
        The PR body must carry closes #2949.
    assert:
      # NOT `type: not-javascript` (issue #4268 follow-up) — the artifact's
      # `rejectedAlternatives` explicitly rejected inverting the default
      # scorer's own verdict at the promptfoo-assertion layer ("unverified
      # inversion semantics on the pinned promptfoo version and only advisory
      # in CI"). Instead this calls the named export
      # `scorerDetectsDroppedToken` (promptfoo's `file://path.ts:function`
      # convention), which does the inversion itself in plain, testable
      # TypeScript: it PASSES this assertion exactly when the underlying
      # scorer correctly reports `pass:false` for this over-pruned body (the
      # never-push-to-master token genuinely dropped). In a real run against
      # evals/skill-prune/parity.yaml the underlying scorer's own `pass:false`
      # is what aborts the PR and downgrades to a needs-triage issue — this
      # fixture only proves that detection fires.
      - type: javascript
        value: file://scorers/contract-token-parity.ts:scorerDetectsDroppedToken
