name: suite-count-check

# Advisory home for the silent --test-force-exit suite-drop gate (issue #4020,
# PR #4056 follow-up).
#
# scripts/test/redis-db-launch.mjs compares a per-file top-level suite/test
# count captured during `npm test` against the static baseline in
# test/fixtures/suite-count-baseline.json, with up to 2 isolated single-file
# retries absorbing routine jitter. That detection is real and should keep
# running on every PR + master push — but it launched wired into the REQUIRED
# `test` job in ci.yml and immediately found a genuine residual drop in
# test/hydra-branch-prune.test.mts (observed count varies 27/24 across
# isolated runs vs. an expected 33 — the signature of a real drop, not a
# baseline bug). A required job cannot tolerate even one red file: it reddens
# every unrelated PR repo-wide and wedges the merge queue.
#
# So this lives in its OWN workflow — deliberately NOT inside ci.yml, and
# deliberately NOT added to the required `test` job's exit path — because
# ci.yml is exact-match Verifier Core (ADR-0001/ADR-0015: "the gate that
# gates the gate", operator-only / T4). A new advisory verification is not a
# change to the merge gate, so it belongs in a sibling that lands as a normal
# T3 change (operator memory feedback_ci_gate_separate_workflow_avoids_tier0),
# same lane as test-typecheck.yml.
#
# `scripts/test/redis-db-launch.mjs`'s gate-failure paths are non-blocking by
# DEFAULT (see `isGateBlocking()` in that file) — a shortfall prints the full
# `SUITE-COUNT GATE FAILED` block but does not flip the exit code, so `npm
# test` in the required `test` job (and `test:debug`/`test:file` everywhere
# else) never fails because of this gate. Setting SUITE_COUNT_GATE_BLOCKING=1,
# as this workflow does below, restores the hard-fail behavior — so THIS job
# (non-required) goes red on a shortfall without ever touching the required
# job's exit code.
#
# Promotion criteria back to required/blocking: this workflow runs clean
# (no shortfall surviving both isolated retries) across several consecutive
# master-push runs, AND the currently-known residual
# (test/hydra-branch-prune.test.mts, tracked in #4062) has its own tracked
# fix landed and verified stable. Until then this is signal, not a gate.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: suite-count-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite-count-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Full suite with the suite-count gate in BLOCKING mode (advisory job only)
        env:
          SUITE_COUNT_GATE_BLOCKING: "1"
        run: npm test
