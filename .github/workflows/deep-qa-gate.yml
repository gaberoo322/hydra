name: deep-qa-gate

# T4 Deep-QA gate (ADR-0020 Slice 1, issue #847).
#
# The required CI check that enforces the SHA-bound Deep-QA PASS marker before
# a Verifier-Core (T4) PR may merge. It is the independent CI enforcement of
# the proof signal that `hydra-qa`'s T4 PASS path posts
# (`Verifier-Core deep-QA: PASS @ <head-sha>`). For non-T4 PRs it reports
# success immediately — it never blocks the ~95% common case.
#
# ## Why two triggers
#
#  - `pull_request`  — fires at open/sync/reopen so the `deep-qa-gate` status
#    exists from the start (initially failing for a T4 PR with no marker yet),
#    and re-evaluates on every push (a new head SHA invalidates a stale
#    marker — the SHA-bound guarantee).
#  - `issue_comment` — fires when QA posts the PASS marker comment, flipping
#    the status green WITHOUT requiring a new push. A `pull_request`-only gate
#    would be permanently red on a T4 PR, because the marker is posted AFTER
#    PR-open (ADR-0020 Decision 4). Filtered to PR comments via
#    `github.event.issue.pull_request`.
#
# ## Base-ref protection for free (ADR-0020 Decision 4)
#
# GitHub runs `issue_comment`-triggered workflows from the DEFAULT branch's
# copy of this file, never the PR head — so the `issue_comment` arm's gate
# logic is base-ref-protected for free (the same Live-Gate Invariant the
# `tier-gate` job buys with explicit base-ref extraction; here the platform
# hands it to us). The `pull_request` arm DOES run the PR-head copy, so this
# workflow is registered in `VERIFIER_CORE_PATHS` (src/untouchable.ts) — a PR
# editing it classifies T4 and is base-ref-classified by the live tier-gate,
# preventing a PR from neutering its own gate logic on its head.
#
# ## Status mechanism
#
# Reports a commit STATUS (not a check-run) named exactly `deep-qa-gate`
# against the PR head SHA via the commit-status REST API
# (`POST /repos/{owner}/{repo}/statuses/{sha}`). A commit status is the right
# primitive for a tier-conditional required check: a status the workflow
# reports on demand can be set `success` for non-T4 PRs immediately, whereas a
# branch-protection-required *check-run* that this workflow never produces for
# non-T4 PRs would leave them blocked forever. The operator adds `deep-qa-gate`
# to branch-protection required checks AFTER this lands (the ADR-0020 ordering
# invariant); until then the status reports but does not block.
#
# ## CheckRun rollup: the mirror (issue #868) + the re-run clearing action (#3869)
#
# The commit STATUS above is the SINGLE authoritative, branch-protection-required
# primitive. But the PR checks ROLLUP (`statusCheckRollup`, which the autopilot
# and the GitHub UI read) resolves the name `deep-qa-gate` from BOTH
# StatusContexts and CheckRuns, and the `pull_request` arm at PR-open emits its
# own CheckRun named `deep-qa-gate` (the Actions run itself); for a T4 PR that
# arm reports red at open/synchronize (no marker exists yet).
#
# #868's original model — that this red arm gets CANCELLED by the shared
# concurrency group when the `issue_comment` arm fires on the PASS marker, and
# that a later-concluding same-named green entry then becomes "the latest result
# for the name" — was FALSIFIED by the #3869 diagnosis (PR #3853, evidence:
# https://github.com/gaberoo322/hydra/issues/3869#issuecomment-5399673582):
#
#  - On the real T4 path the marker is posted minutes-to-days AFTER PR-open, the
#    `pull_request` arm has long since COMPLETED as failure, and nothing is
#    running concurrently for the concurrency group to cancel.
#  - GitHub resolves a required context name by WORST result across the latest
#    same-named results, not by whichever concluded most recently. A
#    completed-failure job CheckRun keeps the required context red even against
#    a NEWER green commit status AND a NEWER green mirror CheckRun (observed on
#    PR #3853, twice, ~29 and ~38 minutes wedged). Green results can only ADD
#    themselves; they cannot SUPERSEDE a red completed entry.
#
# Two consequences, both load-bearing below:
#
#  1. The `issue_comment` arm — which runs the base-ref (default-branch) copy,
#     so it is base-ref-protected for free — still creates a CheckRun named
#     `deep-qa-gate` on the RESOLVED head SHA, mirroring the just-computed
#     STATE. The mirror keeps the rollup entry unambiguous for the shape #868
#     DID observe and fix — a genuinely CANCELLED arm entry (the #859 dogfood;
#     memory note reference_deep_qa_gate_checkrun_vs_status) — and keeps
#     `statusCheckRollup` readable for the autopilot. It is an ADVISORY mirror:
#     it always reports the SAME state as the commit status and never
#     contradicts it; the commit status stays the only branch-protection-
#     required check (making the CheckRun a second required check would
#     re-introduce the non-T4-blocked-forever risk ADR-0020 Decision 4
#     rejected). Creating a CheckRun needs the `checks: write` scope — a THIRD
#     scope distinct from `statuses: write` (the commit-status primitive) and
#     `contents`.
#  2. Because the mirror cannot clear a completed-failure entry, the arm ALSO
#     re-runs the PR's latest completed-failure `pull_request`-arm run for the
#     current head SHA (needs `actions: write`). That automates the ONE action
#     that empirically unblocked #3853: a re-run supersedes the ENTIRE prior
#     attempt (after it, `filter=latest` hides the whole attempt-1 check-run
#     set, the failure CheckRun included), and the re-executed arm re-evaluates
#     the marker — now present — and goes green on its own.

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same PR (mirrors ci.yml's PR de-dup). Group by
# PR number so the issue_comment and pull_request arms for one PR share a lane.
concurrency:
  group: deep-qa-gate-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

# - statuses: write is required to POST a commit status — the gate's whole job
#   (the commit-status REST API needs the `statuses` scope, NOT `contents`).
# - checks: write is required to create the advisory CheckRun rollup mirror
#   (issue #868). The Checks API (`POST /repos/{owner}/{repo}/check-runs`) needs
#   the `checks` scope — a THIRD scope distinct from `statuses` and `contents`.
#   The commit STATUS stays the only branch-protection-required primitive.
# - actions: write is required to RE-RUN the completed-failure `pull_request`
#   arm's workflow run (issue #4208, from the #3869 diagnosis):
#   `POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun` needs the `actions`
#   scope. The re-run is the only action that supersedes the red attempt and so
#   the only one that can clear the required context — the green mirror cannot.
# - contents: read for actions/checkout.
# - pull-requests: read for `gh pr view --json comments,headRefOid`.
permissions:
  contents: read
  pull-requests: read
  statuses: write
  checks: write
  actions: write

jobs:
  deep-qa-gate:
    # On issue_comment, only run for comments on PRs (not plain issues).
    if: ${{ github.event_name == 'pull_request' || github.event.issue.pull_request }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: npm ci

      - name: Evaluate deep-qa-gate and report status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Resolve the PR's CURRENT head SHA + changed files + comment bodies.
          # For issue_comment events there is no PR object on the event, so we
          # resolve everything from the PR number via the API.
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          echo "PR #$PR_NUMBER head SHA: $HEAD_SHA (event: $EVENT_NAME)"

          gh pr diff --name-only "$PR_NUMBER" --repo "$REPO" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          # Classify the PR's tier using the head-tree classifier. (This arm
          # only runs the head copy on pull_request; the issue_comment arm runs
          # the default-branch copy — base-ref-protected for free. Either way
          # the SAME classifier authority is used, scripts/tier-classify.ts.)
          mapfile -t FILES < <(grep -v '^[[:space:]]*$' changed-files.txt || true)
          TIER_JSON="$(npx tsx scripts/tier-classify.ts "${FILES[@]}" 2>/dev/null || echo '{}')"
          echo "Tier classification: $TIER_JSON"
          PR_TIER="$(printf '%s' "$TIER_JSON" | jq -r '.tier // empty' 2>/dev/null || true)"
          echo "PR tier: ${PR_TIER:-unknown}"

          STATE="failure"
          DESCRIPTION=""

          if [ "$PR_TIER" != "4" ]; then
            # Non-T4: the deep-qa-gate does not apply — report success at once.
            STATE="success"
            DESCRIPTION="Non-T4 PR — deep-QA gate not required."
          else
            # T4: pass IFF a fresh Deep-QA PASS marker (matching THIS head SHA)
            # is present in the PR comments. Uses the shared pure helper so the
            # marker literal is defined once (scripts/ci/qa-verdict.ts).
            gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
              --jq '[.comments[].body]' > pr-comments.json
            FRESH="$(HEAD_SHA="$HEAD_SHA" node --no-warnings --experimental-strip-types -e "
              import('./scripts/ci/qa-verdict.ts').then(async ({hasFreshDeepQaPass}) => {
                const fs = await import('node:fs');
                const comments = JSON.parse(fs.readFileSync('pr-comments.json','utf8'));
                process.stdout.write(hasFreshDeepQaPass(comments, process.env.HEAD_SHA) ? 'yes' : 'no');
              });
            ")"
            echo "Fresh Deep-QA PASS marker present for $HEAD_SHA: $FRESH"
            if [ "$FRESH" = "yes" ]; then
              STATE="success"
              DESCRIPTION="T4 deep-QA PASS marker present for current head SHA."
            else
              STATE="failure"
              DESCRIPTION="T4 PR missing a Verifier-Core deep-QA PASS marker for the current head SHA."
            fi
          fi

          echo "Reporting deep-qa-gate=$STATE on $HEAD_SHA: $DESCRIPTION"
          # Issue #4117. This POST used to be a bare `gh api` under
          # `set -euo pipefail`. On PR #4116 a transient 5xx during a GitHub
          # outage killed the step AFTER it had printed "success", leaving the
          # REQUIRED deep-qa-gate context unposted with no diagnostic beyond
          # `exit 1` — and because this check is required for EVERY PR
          # (non-T4 ones included, where it is a formality), that froze the
          # merge queue until a human noticed.
          #
          # The wrapper retries transient failures (5xx / 429 / no response)
          # on a bounded backoff, fails fast on 4xx so a 403 permissions bug
          # is not buried under a retry storm, and always prints the HTTP
          # status and response body. The logic lives in scripts/ci/ so it can
          # be unit-tested (test/post-commit-status.test.mts) rather than
          # embedded in a Verifier-Core workflow, where it could not be.
          # The exit status is captured rather than allowed to abort the step,
          # so the advisory CheckRun mirror below is still ATTEMPTED even when
          # the authoritative status POST failed (artifact INV-7: the two are
          # executed independently, and neither's failure silently prevents
          # the other). The failure is re-raised at the end of the step, so a
          # PR whose status never posted still ends red.
          STATUS_POST_RC=0
          node --no-warnings --experimental-strip-types \
            scripts/ci/post-commit-status.ts \
            "$HEAD_SHA" "$STATE" "deep-qa-gate" "$DESCRIPTION" || STATUS_POST_RC=$?

          # CheckRun rollup mirror (issue #868). The commit status above is the
          # single branch-protection-required primitive; this CheckRun is an
          # ADVISORY mirror that reports the SAME state so the PR checks rollup's
          # `deep-qa-gate` entry is unambiguous. It clears the shape #868
          # observed — a genuinely CANCELLED arm entry (the #859 dogfood) — but
          # NOT a completed-failure one: the rollup resolves worst-result-wins,
          # so a red completed entry stays red however green and however recent
          # this mirror is (#3869; the re-run block below clears that shape).
          # Emit it ONLY from the issue_comment arm: that arm runs the base-ref
          # (default-branch) copy, so it is base-ref-protected for free. The
          # pull_request arm already produces its own like-named CheckRun (the
          # Actions run) and re-runs on every push, so emitting a second one
          # there is redundant.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Map the commit-status STATE onto a CheckRun conclusion; the
            # CheckRun must NEVER contradict the status.
            if [ "$STATE" = "success" ]; then
              CHECK_CONCLUSION="success"
            else
              CHECK_CONCLUSION="failure"
            fi
            echo "Mirroring deep-qa-gate CheckRun=$CHECK_CONCLUSION on $HEAD_SHA"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/check-runs" \
              -f name="deep-qa-gate" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="$CHECK_CONCLUSION" \
              -f output[title]="deep-qa-gate" \
              -f output[summary]="$DESCRIPTION" \
              || echo "WARN: deep-qa-gate CheckRun mirror failed (non-fatal — the commit status is authoritative)"
          fi

          # Re-run clearing action (issue #4208, from the #3869 diagnosis; PR
          # #3853 evidence). The green status + green mirror above CANNOT clear
          # the required context when the `pull_request` arm already COMPLETED
          # as failure for this head SHA — the rollup resolves worst-result-wins
          # across latest same-named results, and only re-running the failed run
          # supersedes its whole red attempt (after a re-run, `filter=latest`
          # hides the attempt-1 check runs; the re-executed arm sees the
          # now-present marker and goes green on its own). Guards:
          #  - issue_comment arm only, STATE=success only, T4 PRs only. Never
          #    re-run on STATE=failure — the re-run would just re-fail. Non-T4
          #    PRs never wedge: their pull_request arm posts success at once.
          #  - The list query filters to event=pull_request runs server-side,
          #    and the jq select re-checks head_sha/status/conclusion
          #    client-side, so a cancelled or already-green arm run (or one
          #    belonging to an older head) is skipped cleanly.
          #  - Non-fatal by design: this arm's own job CheckRun participates in
          #    the same required context, so failing HERE would add a NEW red
          #    entry to the very rollup this block exists to clear.
          #  - No recursion: the re-run is a `pull_request`-event run — it posts
          #    its own status, emits no mirror (pull_request arm), and triggers
          #    no `issue_comment` event. If GitHub's concurrency group applies
          #    to re-runs and cancels this run for it, every durable side effect
          #    above (status POST, mirror) has already landed, and a cancelled
          #    entry is exactly the shape the mirror + the re-run's later green
          #    entry DO clear (#868).
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$STATE" = "success" ] && [ "$PR_TIER" = "4" ]; then
            RUNS_JSON="$(gh api \
              "/repos/${REPO}/actions/workflows/deep-qa-gate.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=20" \
              2>/dev/null || echo '')"
            if [ -z "$RUNS_JSON" ]; then
              echo "WARN: could not list deep-qa-gate runs for $HEAD_SHA (gh api failed) — skipping the re-run clearing action; if the pull_request arm completed failure, the required context stays pinned red until that run is re-run manually (#3869)"
            else
              FAILED_RUN_ID="$(printf '%s' "$RUNS_JSON" \
                | jq -r --arg head "$HEAD_SHA" \
                  '[.workflow_runs[] | select(.event == "pull_request" and .head_sha == $head and .status == "completed" and .conclusion == "failure")] | max_by(.id) | .id // empty')"
              if [ -n "$FAILED_RUN_ID" ]; then
                echo "Re-running completed-failure pull_request-arm run $FAILED_RUN_ID (head $HEAD_SHA) to supersede its red attempt"
                RERUN_RC=0
                gh api --method POST "/repos/${REPO}/actions/runs/${FAILED_RUN_ID}/rerun" \
                  || RERUN_RC=$?
                if [ "$RERUN_RC" -ne 0 ]; then
                  echo "WARN: rerun POST for run $FAILED_RUN_ID failed (non-fatal) — the green status + mirror are posted; the required context may stay pinned red until that run is re-run manually (#3869)"
                fi
              else
                echo "No completed-failure pull_request-arm deep-qa-gate run for $HEAD_SHA — nothing to clear (arm green, cancelled, or absent)."
              fi
            fi
          fi

          # Fail the job if the gate is not green, so the run itself is a clear
          # red/green signal in the Actions UI (the required check is the
          # commit status, but a red job is the faster human signal).
          if [ "$STATE" != "success" ]; then
            echo "::error::deep-qa-gate failed: $DESCRIPTION"
            exit 1
          fi

          # Re-raise a failed status POST (issue #4117). Deferred to here so it
          # never short-circuits the CheckRun mirror above; the diagnostics
          # naming the HTTP status and body were already printed by the wrapper.
          if [ "$STATUS_POST_RC" -ne 0 ]; then
            echo "::error::deep-qa-gate computed '$STATE' but could NOT post the commit status on $HEAD_SHA — the required context is absent and this PR cannot merge until it is posted. See the [post-commit-status] diagnostics above."
            exit "$STATUS_POST_RC"
          fi
