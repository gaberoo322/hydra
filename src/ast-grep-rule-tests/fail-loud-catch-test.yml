# Rule tests for src/ast-grep-rules/fail-loud-catch.yml (issue #4732).
# Run: npx --yes -p @ast-grep/cli@0.43.0 ast-grep test --skip-snapshot-tests
# `valid` snippets must NOT match; `invalid` snippets MUST match.
id: fail-loud-catch
valid:
  - |
    try { run(); } catch (err) { console.error("[x] run failed:", err); }
  - |
    try { run(); } catch (err) { console.warn("[x] run degraded:", err); }
  - |
    try { run(); } catch (err) { logger.error({ err }, "run failed"); return null; }
  - |
    try { run(); } catch (err) { logger.warn({ err }, "run degraded"); }
  - |
    try { run(); } catch (err) { this.logger.error({ err }, "run failed"); }
  - |
    try { run(); } catch { /* intentional: best-effort cleanup */ }
  - |
    try { run(); } catch (e) {
      // intentional: the cache is optional, a miss is fine
      return undefined;
    }
  - |
    try { run(); } catch (err) { throw new RunError("run failed", { cause: err }); }
  - |
    try { run(); } catch (err) {
      if (isTransient(err)) { console.error("[x] transient:", err); return retry(); }
      throw err;
    }
  - |
    try { run(); } catch (err) { process.stderr.write(`run failed: ${err}\n`); process.exit(2); }
invalid:
  - |
    try { run(); } catch {}
  - |
    try { run(); } catch (e) { return x; }
  - |
    try { run(); } catch (err) { console.log("failed", err); }
  - |
    try { run(); } catch (err) {
      // swallow
      return null;
    }
  - |
    async function f() { try { await run(); } catch (err) { return { ok: false }; } }
