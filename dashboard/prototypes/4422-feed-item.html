  { id: "queue-4433", bucket: "decision-queue", title: "PR #4433 — Pre-merge Gate readable to the loop (T3, GLM-authored)", url: "#", line: "in today's queue", crossedAt: "05:40", age: "9h", tier: "T3",

const KIND_LABEL = { "in-dashboard": "in dashboard", "terminal-skill": "terminal", "config-env": "config / env", "credential": "credential", "research-beyond-autonomy": "research", "vision-decision": "vision" };
const bucketOf = (it) => BUCKETS.find(b => b.id === it.bucket);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ─── The one affordance component: kind → control (used by all variants) ───
function affordance(a, id, opts = {}) {
  const tier = a.confirmTier ? `<span class="tier">${a.confirmTier === "confirm-first" ? "confirms first" : "immediate · undo"}</span>` : "";
  switch (a.kind) {
    case "in-dashboard":
      return a.confirmTier === "confirm-first"
        ? `<span id="arm-${id}"><button class="btn go" type="button" onclick="arm('${id}')">${esc(a.label)}…</button></span>
           <span id="conf-${id}" class="hidden"><button class="btn confirm-yes" type="button" onclick="fire('${id}','${esc(a.label)}')">Confirm ${esc(a.label.toLowerCase())}</button> <button class="btn" type="button" onclick="disarm('${id}')">Cancel</button></span> ${tier}`
        : `<button class="btn go" type="button" onclick="fire('${id}','${esc(a.label)}',true)">${esc(a.label)}</button> ${tier}`;
    case "terminal-skill":
      return `<span class="cmd">${esc(a.command)}</span> <button class="btn copy" type="button" onclick="copy('${esc(a.command)}')">Copy</button>${opts.what === false ? "" : ` <span class="sm dim">${esc(a.label)}</span>`}`;
    case "config-env":
      return `<span class="sm muted">${esc(a.project)} · </span><span class="cmd">${esc(a.file)}</span><br><span class="cmd">${esc(a.change)}</span> <button class="btn copy" type="button" onclick="copy('${esc(a.change)}')">Copy line</button> <a class="btn link" href="#">View file ↗</a>`;
    case "credential":
      return `<a class="btn link" href="${esc(a.href)}" target="_blank" rel="noreferrer">${esc(a.label)} ↗</a> <span class="sm dim">operator-only · ADR-0005</span>`;
    case "research-beyond-autonomy":
      return `<a class="btn link" href="${esc(a.href)}">${esc(a.label)} ↗</a> <span class="sm dim">no dispatch until you decide</span>`;
    case "vision-decision":
      return `<a class="btn link" href="${esc(a.href)}">${esc(a.label)} ↗</a> <span class="sm dim">you edit vision.md; the machine never does</span>`;
  }
  return "";
}
const kindChip = (a) => `<span class="chip k-${a.kind}">${KIND_LABEL[a.kind]}</span>`;
const preList = (a) => a.preconditions.length ? `<ul class="pre">${a.preconditions.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : `<span class="sm dim">no preconditions</span>`;
const altLinks = (it) => `<span class="alts">or: ${it.alternatives.map(a => `<a href="#" title="${esc(a.consequence)}">${esc(a.label)}</a>`).join(" · ")} · <a href="#">Skip</a></span>`;

// ─── Variant A — Ledger: dense rows, action cell, disclosure drawer ───
function renderA() {
  const rows = ITEMS.map(it => {
    const b = bucketOf(it);
    if (it.aggregate) return `
      <div class="row agg" id="row-${it.id}">
        <div class="rank hot">${b.rank}</div>
        <div><div class="title">${esc(it.title)}</div><div class="reasons">${it.reasons.map(esc).join("<span class='dim'> · </span>")}</div></div>
        <div class="act">${affordance(it.recommended, it.id, { what: false })}</div>
        <button class="tog" type="button" aria-label="Explain" onclick="toggle('row-${it.id}')">▾</button>

    return `
      <div class="row" id="row-${it.id}">

        <div><a class="title" href="${it.url}">${esc(it.title)}</a></div>

  }).join("");
  return panel("Needs attention", `${ITEMS.length}`, "Drain order 0→6, oldest crossing first inside a bucket. ▾ explains the recommendation.",
    `<div class="ledger">${rows}</div>`) + workA();
}
function drawerBody(it) {

    <div class="full" style="display:flex;gap:14px;flex-wrap:wrap;align-items:baseline">${kindChip(a)} ${altLinks(it)} <span class="why">${esc(it.rationale)}</span> <span class="doc">→ ${esc(it.doc)}</span></div>`;
}

          <div class="full" style="display:flex;gap:14px;flex-wrap:wrap;align-items:baseline">${kindChip({ kind: "in-dashboard" })} <span class="alts">or: <a href="#">Needs more info</a> · <a href="#">Won't do</a> · <a href="#">Skip</a></span> <span class="doc">→ ADR-0034 §7 · hydra-review §4</span></div>

// ─── Variant B — Drain order: bucket sections, recommendation as a sentence ───
function renderB() {
  const groups = BUCKETS.map(b => {
    const its = ITEMS.filter(i => i.bucket === b.id);
    if (!its.length) return "";
    const body = its.map(it => {
      const a = it.recommended;
      if (it.aggregate) return `
        <div class="agg">
          <div><div class="big">${esc(it.title)}</div><ul>${it.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
          <div class="do">
            <div class="lead"><span class="verb">Do:</span> ${affordance(a, it.id)}</div>
            ${preList(a)}<div class="cons">→ ${esc(a.consequence)}</div>${altLinks(it)}
          </div>
        </div>`;
      return `
        <div class="item">
          <div>
            <div class="head"><a href="${it.url}">${esc(it.title)}</a></div>
            <div class="meta">${esc(it.line)} · <span class="age">${it.age}</span></div>
            <div class="why" style="margin-top:6px">${esc(it.rationale)}</div>
          </div>
          <div class="do">
            <div class="lead"><span class="verb">Do:</span> ${affordance(a, it.id)}</div>
            ${preList(a)}<div class="cons">→ ${esc(a.consequence)}</div>${altLinks(it)}
          </div>
        </div>`;
    }).join("");
    return `<div class="bucket"><h3><span class="r">${b.rank}</span> ${esc(b.name)} <span class="n" style="font-size:11px;color:var(--dim)">${its.length}</span> <span class="why-order">— ${esc(b.why)}</span></h3>${body}</div>`;
  }).join("");
  return panel("Needs attention", `${ITEMS.length}`, "Fixed bucket drain order; each bucket says why it ranks where it does.",
    `<div class="drain">${groups}</div>`) + workB();
}
function workB() {
  return panel("Work · ready queue (excerpt)", null, "Preconditions are a live checklist beside the button; the button is disabled until every line is ✓.",
    `<div class="work-row">
      <div><a href="#" style="text-decoration:none">#4412 — swap-readiness: extend the target-coupling ratchet to playbook + scripts/autopilot</a><div class="lane">lane: needs-triage · updated 14:52</div></div>
      <div class="explain" style="min-width:300px">
        <div class="checklist"><span class="ok">✓</span><span>## Files in scope present</span><span class="ok">✓</span><span>not blocked</span><span class="ok">✓</span><span>not already ready-for-agent</span></div>
        <div>${affordance({ kind: "in-dashboard", label: "Promote", confirmTier: "confirm-first" }, "w2")}</div>
        <div class="cons"><b>Dispatch trigger.</b> dev_orch takes it next tick and spends quota.</div>

      <div class="explain" style="min-width:300px">

        <div><button class="btn go" type="button" disabled style="opacity:.4;cursor:not-allowed">Promote…</button> <span class="sm dim">a blocked issue must never be promoted</span></div>
      </div>

}

// ─── Variant C — Next action first: one hero, then a compact queue ───
function renderC() {
  const [top, ...rest] = ITEMS;
  const a = top.recommended; const b = bucketOf(top);
  const hero = `
    <div class="hero">
      <div class="eyebrow"><span>Do this next</span> <span class="chip bucket-chip">${b.rank} · ${esc(b.name)}</span> ${kindChip(a)}</div>
      <h3>${top.url ? `<a href="${top.url}">${esc(top.title)}</a>` : esc(top.title)}</h3>
      ${top.reasons ? `<div class="mono xs muted">${top.reasons.map(esc).join(" · ")}</div>` : `<div class="mono xs muted">${esc(top.line)} · ${top.age}</div>`}
      <div class="reco"><b>${esc(a.label)}</b> — ${esc(a.consequence)}</div>
      <div class="act">${affordance(a, top.id, { what: false })}</div>
      <div class="cols">
        <div><h4>Before you do</h4>${preList(a)}</div>
        <div><h4>Why this first</h4><div class="sm muted">${esc(top.rationale)}</div><div class="doc" style="margin-top:4px">→ ${esc(top.doc)}</div></div>
      </div>
      <div>${altLinks(top)}</div>
    </div>`;
  const queue = rest.map(it => {
    const bb = bucketOf(it); const ra = it.recommended;
    const then = ra.kind === "terminal-skill" ? `<span class="cmd" style="font-size:11px">${esc(ra.command)}</span>`
               : ra.kind === "in-dashboard" ? `<span class="l">${esc(ra.label)}</span>`
               : ra.kind === "config-env" ? `<span class="l mono">${esc(ra.change.split("=")[0].replace("Environment=", ""))}=…</span>`
               : `<span class="l">${esc(ra.label)} ↗</span>`;
    return `<div class="q${it.aggregate ? " agg" : ""}"><div class="r">${bb.rank}</div>${it.url ? `<a href="${it.url}">${esc(it.title)}</a>` : `<span>${esc(it.title)}</span>`}<div class="then">${kindChip(ra)} ${then}</div><div class="age">${it.age}</div></div>`;
  }).join("");
  return panel("Needs attention", `${ITEMS.length}`, "The top of the drain order gets the whole explanation; the rest waits in one line each.",
    `<div class="next">${hero}<div class="queue"><h4>Then, in order</h4>${queue}</div></div>`) + workC();
}
function workC() {
  return panel("Work · ready queue (excerpt)", null, "Hover or focus Promote: the explanation card appears at the moment of need and nowhere else.",
    `<div class="work-row">
      <div><a href="#" style="text-decoration:none">#4412 — swap-readiness: extend the target-coupling ratchet to playbook + scripts/autopilot</a><div class="lane">lane: needs-triage · updated 14:52</div></div>

}

// ─── chrome + behaviour (stubs; nothing mutates) ───
function panel(title, count, sub, body) {
  return `<section class="panel"><header><div><h2 class="t">${esc(title)}${count ? `<span class="n">${count}</span>` : ""}</h2><p class="st">${esc(sub)}</p></div><div class="asof">as of 14:47</div></header>${body}</section>`;
}
function toggle(id) { document.getElementById(id).classList.toggle("open"); }
function arm(id) { document.getElementById(`arm-${id}`).classList.add("hidden"); document.getElementById(`conf-${id}`).classList.remove("hidden"); }
function disarm(id) { document.getElementById(`arm-${id}`).classList.remove("hidden"); document.getElementById(`conf-${id}`).classList.add("hidden"); }
function fire(id, label, undo) { if (!undo) disarm(id); showToast(`${label}: verified ✓ (stub — nothing was sent)`); }
function copy(cmd) { try { navigator.clipboard.writeText(cmd); } catch (e) { /* intentional: clipboard may be blocked in preview */ } showToast(`Copied: ${cmd}`); }
let toastT; function showToast(t) { const el = document.getElementById("toast"); document.getElementById("toastText").textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(hideToast, 6000); }
function hideToast() { document.getElementById("toast").classList.remove("show"); }

const VARIANTS = { A: ["Ledger", renderA], B: ["Drain order", renderB], C: ["Next action first", renderC] };
const KEYS = Object.keys(VARIANTS);
function current() { const v = new URLSearchParams(location.search).get("variant"); return KEYS.includes(v) ? v : "A"; }
function show(v) {
  const [name, fn] = VARIANTS[v];
  document.getElementById("root").innerHTML = fn();
  document.getElementById("lbl").innerHTML = `${v} — ${name}<small>?variant=${v} · ← → to switch</small>`;
  const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u);
}
function step(d) { const i = KEYS.indexOf(current()); show(KEYS[(i + d + KEYS.length) % KEYS.length]); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", (e) => {
  const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
show(current());
</script>
